<!doctype html><meta charset="utf-8"><title>Local lazy media fixture</title>
<style>
body{margin:0} header{height:1400px} main{width:300px;margin:0 auto} article{height:850px} img{display:block;width:100px;height:100px;object-position:50% 50%} footer{height:1000px}
</style>
<header></header><main id="instance">
<article><img data-src="pending" alt="Main content"><p>First item</p></article>
<article><img data-original="pending" alt="Main content"><p>Second item</p></article>
</main><footer></footer>
<script>
// This is the application's own lazy loader, not the checker's implementation.
const options=new URLSearchParams(location.search), wide=options.get('wide')==='1';
window.sourceWrites=0;window.observed=[];
const observer=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;
window.observed.push(entry.target.parentElement.tagName);
if(options.get('never')==='1')continue;
sourceWrites++;
entry.target.src=`data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${wide?200:100}" height="100"><rect width="100%" height="100%" fill="gray"/></svg>`)}`;
observer.unobserve(entry.target);
}}, {threshold:.1});
for(const image of document.images){image.style.objectFit=options.get('fit')||'fill';
if(options.get('padding')==='1'){image.style.padding='10px';image.style.border='2px solid';}
observer.observe(image);}
</script>
